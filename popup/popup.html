<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BackendMocker</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
    />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="bg-slate-100 text-slate-900">
    <main class="w-80 p-4 space-y-4">
      <header>
        <h1 class="text-lg font-semibold">BackendMocker</h1>
        <p class="text-sm text-slate-600">Toggle all mock rules instantly.</p>
      </header>

      <section class="bg-white border border-slate-200 rounded-lg p-3">
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium">Mock engine</span>
          <button
            id="engineToggle"
            type="button"
            role="switch"
            aria-checked="true"
            class="relative inline-flex h-7 w-14 items-center rounded-full transition-colors bg-blue-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2"
          >
            <span class="sr-only">Toggle mock engine</span>
            <span
              id="engineThumb"
              class="inline-block h-6 w-6 transform rounded-full bg-white shadow transition-transform translate-x-7"
            ></span>
          </button>
        </div>
        <p id="engineStatus" class="mt-3 text-xs text-slate-600">
          Mocking is currently enabled.
        </p>
      </section>

      <button
        id="openOptions"
        class="w-full rounded-lg bg-slate-900 text-white py-2 px-3 text-sm font-medium hover:bg-slate-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-500"
      >
        Open rules dashboard
      </button>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
